[project]
name = "cosyvoice-fastapi"
version = "1.0.0"
description = "OpenAI-compatible HTTP API for CosyVoice2 / Fun-CosyVoice3"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.12"
dependencies = [
    # --- API wrapper ---
    "fastapi==0.115.6",
    "uvicorn==0.30.0",
    "python-multipart>=0.0.20",
    "setuptools<81",
    # --- CosyVoice engine (mirrors the upstream requirements.txt) ---
    "conformer==0.3.2",
    "diffusers==0.29.0",
    "gdown==5.1.0",
    "grpcio==1.57.0",
    "grpcio-tools==1.57.0",
    "hydra-core==1.3.2",
    "HyperPyYAML==1.2.3",
    "inflect==7.3.1",
    "librosa==0.10.2",
    "lightning==2.2.4",
    "matplotlib==3.7.5",
    "modelscope==1.20.0",
    "networkx==3.1",
    "numpy==1.26.4",
    "omegaconf==2.3.0",
    "onnx==1.16.0",
    "onnxruntime==1.18.0",
    "openai-whisper==20231117",
    "protobuf==4.25",
    "pyarrow==18.1.0",
    "pydantic==2.7.0",
    "pyworld==0.3.4",
    "rich==13.7.1",
    "soundfile==0.12.1",
    "tensorboard==2.14.0",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "transformers==4.51.3",
    "x-transformers==2.11.24",
    "wetext==0.0.4",
    "wget==3.2",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchaudio = [{ index = "pytorch-cu128" }]

[tool.uv]
# openai-whisper's sdist imports pkg_resources in setup.py; newer setuptools no
# longer ships it, so the build environment needs the pinned setuptools.
extra-build-dependencies = { openai-whisper = ["setuptools<81"] }
